<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f131c" />
    <title>ZenFast — Você está offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100dvh;
        background: #0f131c;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        color: #dfe2ef;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        -webkit-font-smoothing: antialiased;
      }
      main {
        position: relative;
        width: min(420px, 100%);
        text-align: center;
        padding: 40px 28px;
        border-radius: 32px;
        background: rgba(28, 31, 41, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      main::before {
        content: '';
        position: absolute;
        top: -120px;
        left: 50%;
        width: 320px;
        height: 320px;
        transform: translateX(-50%);
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(245, 158, 11, 0.22) 0%,
          rgba(15, 19, 28, 0) 66%
        );
        pointer-events: none;
      }
      .logo {
        position: relative;
        width: 88px;
        height: 88px;
        display: block;
        margin: 0 auto 20px;
      }
      .eyebrow {
        position: relative;
        display: inline-block;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #ffc174;
        margin-bottom: 12px;
      }
      h1 {
        position: relative;
        margin: 0 0 12px;
        font-size: 28px;
        line-height: 34px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      p {
        position: relative;
        margin: 0 0 28px;
        font-size: 14px;
        line-height: 22px;
        color: #d8c3ad;
      }
      .actions {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      button {
        width: 100%;
        height: 52px;
        border: none;
        border-radius: 999px;
        background: linear-gradient(90deg, #f59e0b, #ffc174);
        color: #613b00;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 0 24px rgba(245, 158, 11, 0.35);
      }
      a {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 48px;
        border-radius: 999px;
        background: rgba(49, 53, 63, 0.6);
        color: #dfe2ef;
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
      }
      button:active,
      a:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <main>
      <svg
        class="logo"
        viewBox="0 0 100 100"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <linearGradient id="offlineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F59E0B" />
            <stop offset="100%" stop-color="#EF4444" />
          </linearGradient>
        </defs>
        <circle
          cx="50"
          cy="50"
          r="42"
          stroke="#1F2937"
          stroke-width="8"
          stroke-linecap="round"
        />
        <path
          d="M 50 8 A 42 42 0 1 1 14 68"
          stroke="url(#offlineGrad)"
          stroke-width="8"
          stroke-linecap="round"
        />
        <circle cx="50" cy="50" r="16" fill="#F59E0B" fill-opacity="0.2" />
        <path
          d="M50 34 V50 L62 56"
          stroke="#F59E0B"
          stroke-width="5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <circle cx="50" cy="8" r="5" fill="#FBBF24" />
      </svg>
      <span class="eyebrow">Sem conexão</span>
      <h1>Você está offline</h1>
      <p>
        O ZenFast mostrou a última tela salva no cache. Assim que a conexão
        voltar, seus registros de jejum, água e peso sincronizam
        automaticamente.
      </p>
      <div class="actions">
        <button onclick="location.reload()" type="button">
          Tentar novamente
        </button>
        <a href="/">Voltar para o início</a>
      </div>
    </main>
  </body>
</html>
